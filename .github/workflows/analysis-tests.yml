name: Handpan app tests
on:
  push:
    paths:
      - src/**
      - tests/**
      - .github/workflows/analysis-tests.yml
      - index.html
      - styles.css
      - sw.js
      - manifest.webmanifest
      - icons/**
      - tools/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch the exact source revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$REPOSITORY.git"
          git fetch --depth=1 origin "$REVISION"
          git checkout --detach FETCH_HEAD
      - name: Run native Web Audio tests in Chrome
        env:
          HANDPAN_SCREENSHOTS: '1'
        run: |
          node --test tests/model.test.mjs
          node tests/run-browser-tests.mjs
